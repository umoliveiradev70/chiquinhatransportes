<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Área do Candidato | Chiquinha Transportes</title>
  <link rel="icon" type="image/png" href="assets/logo.png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@500;600;700;800;900&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="portal.css">
  <script>(function(){const t=localStorage.getItem('cq_theme')||'light';document.documentElement.setAttribute('data-theme',t);})();</script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="firebase-service.js"></script>
</head>
<body class="portal-page">
  <header class="portal-header"><div class="container portal-header-inner">
    <a href="index.html"><img src="assets/logo.png" alt="Chiquinha Transportes" class="portal-logo"></a>
    <div class="portal-actions">
      <button class="btn btn-outline" id="btn-open-profile"><i class="fa-solid fa-user-gear"></i> Meu Perfil</button>
      <button class="btn btn-outline" id="theme-toggle" aria-label="Alternar tema"><i class="fa-solid fa-moon"></i></button>
      <button class="btn btn-outline" id="sign-out"><i class="fa-solid fa-right-from-bracket"></i> Sair</button>
    </div>
  </div></header>
  <main class="portal-content"><div class="container">
    <div id="portal-message" class="portal-alert" style="display:none"></div>
    <div class="portal-heading"><div class="portal-user"><img id="user-photo" src="assets/logo.png" alt=""><div><h1>Área do Candidato</h1><p id="user-name">Carregando seu perfil...</p></div></div></div>
    <div id="applications-list" class="portal-grid"></div>
  </div></main>

  <!-- MODAL: MEU PERFIL & SEGURANÇA -->
  <div class="modal-backdrop" id="profile-modal">
    <div class="modal-card modal-card-sm" style="max-width: 500px;">
      <button class="modal-close-btn" id="close-profile-btn" aria-label="Fechar">
        <i class="fa-solid fa-xmark"></i>
      </button>

      <div class="modal-header">
        <div class="login-brand-icon" style="width: 54px; height: 54px; font-size: 1.5rem; margin: 0 auto 0.75rem;">
          <i class="fa-solid fa-user-gear text-gold"></i>
        </div>
        <h2 class="modal-title text-center" style="padding-right: 0; font-size: 1.45rem;">Meu Perfil & Segurança</h2>
        <p class="modal-subtitle text-center">Atualize seus dados pessoais ou altere sua senha de acesso.</p>
      </div>

      <div class="modal-body" style="padding: 1.5rem 1.75rem;">
        <div id="profile-modal-alert" class="portal-alert" style="display:none; margin-bottom: 1.25rem;"></div>

        <!-- Formulário 1: Informações Pessoais -->
        <form id="form-update-profile" class="auth-form" novalidate style="margin-bottom: 1.5rem;">
          <h3 style="font-size: 0.98rem; font-weight: 700; color: var(--text-main); margin-bottom: 0.25rem; display: flex; align-items: center; gap: 0.5rem;">
            <i class="fa-solid fa-id-card text-gold"></i> Informações Pessoais
          </h3>

          <div class="form-field">
            <label for="profile-name">Nome Completo</label>
            <div class="login-input-wrap">
              <i class="fa-regular fa-user input-icon"></i>
              <input type="text" id="profile-name" required placeholder="Seu nome completo">
            </div>
          </div>

          <div class="form-field">
            <label for="profile-email">E-mail Cadastrado</label>
            <div class="login-input-wrap">
              <i class="fa-regular fa-envelope input-icon"></i>
              <input type="email" id="profile-email" disabled style="opacity: 0.8; cursor: not-allowed; background: var(--bg-subtle);">
            </div>
            <span style="font-size: 0.76rem; color: var(--success, #10b981); display: flex; align-items: center; gap: 0.35rem; margin-top: 0.2rem;">
              <i class="fa-solid fa-circle-check"></i> E-mail verificado e autenticado
            </span>
          </div>

          <button type="submit" class="btn btn-outline w-100" id="btn-save-name">
            <span class="spinner" id="save-name-spinner" style="display: none;"></span>
            <span id="btn-save-name-text"><i class="fa-solid fa-floppy-disk"></i> Atualizar Nome</span>
          </button>
        </form>

        <div class="login-divider"><span>segurança da conta</span></div>

        <!-- Formulário 2: Alteração de Senha -->
        <form id="form-update-password" class="auth-form" novalidate style="margin-top: 1rem;">
          <h3 style="font-size: 0.98rem; font-weight: 700; color: var(--text-main); margin-bottom: 0.25rem; display: flex; align-items: center; gap: 0.5rem;">
            <i class="fa-solid fa-lock text-gold"></i> Alterar Senha
          </h3>

          <div class="form-field">
            <label for="profile-new-pass">Nova Senha (mínimo 6 dígitos)</label>
            <div class="login-input-wrap">
              <i class="fa-solid fa-key input-icon"></i>
              <input type="password" id="profile-new-pass" minlength="6" required placeholder="Digite a nova senha">
              <button type="button" class="btn-toggle-eye" id="toggle-profile-pass" aria-label="Mostrar ou ocultar senha" tabindex="-1">
                <i class="fa-regular fa-eye"></i>
              </button>
            </div>
          </div>

          <div class="form-field">
            <label for="profile-confirm-pass">Confirmar Nova Senha</label>
            <div class="login-input-wrap">
              <i class="fa-solid fa-shield-halved input-icon"></i>
              <input type="password" id="profile-confirm-pass" minlength="6" required placeholder="Confirme a nova senha">
              <button type="button" class="btn-toggle-eye" id="toggle-profile-confirm" aria-label="Mostrar ou ocultar senha" tabindex="-1">
                <i class="fa-regular fa-eye"></i>
              </button>
            </div>
          </div>

          <button type="submit" class="btn btn-primary w-100" id="btn-save-pass">
            <span class="spinner" id="save-pass-spinner" style="display: none;"></span>
            <span id="btn-save-pass-text"><i class="fa-solid fa-key"></i> Salvar Nova Senha</span>
          </button>
        </form>
      </div>
    </div>
  </div>
  <script src="candidato.js"></script>
</body>
</html>
